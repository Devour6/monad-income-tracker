name: Backfill historical snapshots

# Walks backward from earliest existing snapshot, reconstructing epoch_snapshots
# rows by querying the staking precompile at historical block tags. Idempotent
# — safe to run alongside everything else.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      floor:
        description: "Earliest epoch to backfill down to"
        required: false
        default: "1100"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: backfill-snapshots
      cancel-in-progress: false
    steps:
      - name: Hammer backfill endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FLOOR: ${{ github.event.inputs.floor || '1100' }}
        run: |
          for i in 1 2 3 4 5 6; do
            echo "--- iter $i ---"
            curl --fail-with-body --silent --show-error \
              --max-time 65 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://monad-income-tracker.vercel.app/api/cron/backfill-snapshots?floor=$FLOOR&budget_ms=50000" \
              | tee /tmp/snap.json
            echo ""
            jq -r '"  epochs: \(.epochsBackfilled | length)  rows: \(.rowsInserted)  rpc: \(.rpcCalls)  hitFloor: \(.hitFloor)  hitBudget: \(.hitBudget)  err: \(.error)"' /tmp/snap.json || true
            HIT_FLOOR=$(jq -r '.hitFloor' /tmp/snap.json 2>/dev/null || echo "false")
            if [ "$HIT_FLOOR" = "true" ]; then
              echo "reached floor; stopping"
              break
            fi
          done
