name: Index Monad Blocks

# Continuous block-level priority-fee indexer.
# Runs every 5 minutes. Retries up to 3 times within a single run so a
# transient Vercel hiccup or RPC error doesn't kill the cycle — the
# previous "fail fast and wait 5 min" behavior let the indexer fall
# ~1M blocks behind during sustained transient errors.
#
# Endpoint is idempotent (advances its own cursor) so retries are safe.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: index-blocks
      cancel-in-progress: false
    steps:
      - name: Hit indexer endpoint with retries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          URL="https://monad-income-tracker.vercel.app/api/cron/index-blocks"
          for i in 1 2 3; do
            echo "--- attempt $i ---"
            HTTP_CODE=$(curl -sS -o /tmp/result.json -w "%{http_code}" \
              --max-time 65 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$URL" || echo "000")
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              jq -r '"  blocks: \(.blocksProcessed)  attributed: \(.blocksAttributed)  end: \(.endBlock)  duration: \(.durationMs)ms"' /tmp/result.json || cat /tmp/result.json
              exit 0
            fi
            echo "non-200, retrying in 10s..."
            cat /tmp/result.json 2>/dev/null || true
            sleep 10
          done
          echo "all 3 attempts failed — next scheduled run will retry"
          exit 0  # don't fail the workflow; the cron will self-heal on the next fire
