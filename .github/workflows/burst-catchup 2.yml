name: Burst catchup (block + MEV indexers)

# Runs every 30 min. Checks lag via /api/v1/indexer/status. If any indexer
# is more than LAG_THRESHOLD blocks behind chain head, fires that indexer's
# cron endpoint up to MAX_BURSTS times in a row to burn down the backlog.
# When caught up, exits in seconds — zero idle cost.
#
# This is the permanent fix for "indexer silently drifts after a transient
# failure and we have to babysit it." Hardened with retry-per-call so a
# single 5xx doesn't kill the burst.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: burst-catchup
      cancel-in-progress: false
    steps:
      - name: Check lag and burst-catchup if drifting
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://monad-income-tracker.vercel.app"
          LAG_THRESHOLD=50000
          MAX_BURSTS=5

          # call_with_retry <url> — hits an endpoint with 3 retries on
          # transient errors (5xx, network) so a single hiccup doesn't kill
          # the run. Always exits 0; the caller checks the response.
          call_with_retry() {
            local url="$1"
            local attempt
            for attempt in 1 2 3; do
              resp=$(curl -sS --max-time 65 \
                -H "Authorization: Bearer $CRON_SECRET" \
                -w "\nHTTP %{http_code}" \
                "$url" 2>&1) || true
              code=$(echo "$resp" | tail -1 | awk '{print $2}')
              if [ "$code" = "200" ]; then
                echo "$resp" | sed '$d'
                return 0
              fi
              echo "  attempt $attempt failed (http=$code), retrying in 2s..."
              sleep 2
            done
            echo "  all 3 attempts failed"
            return 1
          }

          # Pull current lag for both indexers.
          status=$(curl -sS --max-time 30 "$BASE/api/v1/indexer/status" || echo '{}')
          block_lag=$(echo "$status" | jq -r '.lagBlocks // 0')
          echo "block indexer lag: $block_lag blocks"

          # Block indexer burst.
          if [ "$block_lag" -gt "$LAG_THRESHOLD" ]; then
            echo "block lag exceeds $LAG_THRESHOLD, bursting up to $MAX_BURSTS calls..."
            for i in $(seq 1 $MAX_BURSTS); do
              echo "--- block call $i ---"
              call_with_retry "$BASE/api/cron/index-blocks" | \
                jq -r '"  processed=\(.blocksProcessed) attributed=\(.blocksAttributed) end=\(.endBlock) dur=\(.durationMs)ms"' || true
              # Re-check lag — exit early if caught up.
              new_lag=$(curl -sS --max-time 10 "$BASE/api/v1/indexer/status" | jq -r '.lagBlocks // 0')
              echo "  lag now: $new_lag"
              if [ "$new_lag" -lt "$LAG_THRESHOLD" ]; then
                echo "caught up, stopping block burst"
                break
              fi
            done
          else
            echo "block indexer at-head, skipping burst"
          fi

          # MEV indexer burst — no dedicated status endpoint, so we just fire
          # a few times when block was lagging (MEV has its own cursor and
          # the endpoint is idempotent + budget-bounded, so extra calls are
          # cheap when caught up).
          if [ "$block_lag" -gt "$LAG_THRESHOLD" ]; then
            echo "block was lagging, also bursting MEV indexer..."
            for i in 1 2 3; do
              echo "--- mev call $i ---"
              call_with_retry "$BASE/api/cron/index-mev" | \
                jq -r '"  scanned=\(.blocksScanned) inserted=\(.rowsInserted) end=\(.endBlock) hitBudget=\(.hitBudget)"' || true
            done
          fi

          echo "burst-catchup run complete"
