name: auto-backfill

# Walks the priority-fee indexer backwards in time, hourly.
# Each run pulls one chunk; over time, builds out historical depth without
# blocking the forward indexer. Stops automatically once it hits the floor.

on:
  schedule:
    - cron: "20 * * * *" # hourly at :20 — offset from forward indexer
  workflow_dispatch:
    inputs:
      chunk:
        description: "Blocks per run (default 5000, max 50000)"
        required: false
        default: "5000"
      floor:
        description: "Refuse to walk below this block (default 1)"
        required: false
        default: "1"
      iterations:
        description: "How many chunks to run in this manual invocation"
        required: false
        default: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Drive backfill
        env:
          BASE_URL: ${{ secrets.BACKFILL_BASE_URL || 'https://monad-income-tracker.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHUNK: ${{ github.event.inputs.chunk || '5000' }}
          FLOOR: ${{ github.event.inputs.floor || '1' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
        run: |
          set -euo pipefail
          AUTH_HEADER=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          for i in $(seq 1 "${ITERATIONS}"); do
            echo "── iteration $i / ${ITERATIONS} ──"
            URL="${BASE_URL}/api/cron/auto-backfill?chunk=${CHUNK}&floor=${FLOOR}"
            echo "GET ${URL}"
            RESP=$(curl -sS --max-time 290 "${AUTH_HEADER[@]}" "${URL}")
            echo "${RESP}"

            STATUS=$(echo "${RESP}" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            if [ "${STATUS}" = "complete" ] || [ "${STATUS}" = "no-data" ]; then
              echo "Stopping early (status=${STATUS})"
              exit 0
            fi
            sleep 5
          done
