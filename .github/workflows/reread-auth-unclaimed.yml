name: Re-read auth_unclaimed at deterministic blocks

# Canonicalizes epoch_snapshots.auth_unclaimed_wei for recently closed
# epochs by sampling getDelegator(valId, auth) at (epoch_end - 10 blocks)
# instead of the live cron's "current block" mid-epoch noise.
#
# Hourly cadence — epochs close every ~5.5h so once per hour gives 5x
# coverage. Walks last 4 closed epochs each call (idempotent, self-healing).
# Retries up to 2 times on transient errors so a single hiccup doesn't
# leave a phantom "no income" row visible until the next fire.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: reread-auth-unclaimed
      cancel-in-progress: false
    steps:
      - name: Hit reread endpoint with retries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          URL="https://monad-income-tracker.vercel.app/api/cron/reread-auth-unclaimed"
          for i in 1 2; do
            echo "--- attempt $i ---"
            HTTP_CODE=$(curl -sS -o /tmp/result.json -w "%{http_code}" \
              --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$URL" || echo "000")
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              jq -r '"  ok: \(.ok)  durationMs: \(.durationMs)  epochs: \(.epochsProcessed)  updated: \(.totalUpdated)  failed: \(.totalFailed)"' /tmp/result.json || cat /tmp/result.json
              exit 0
            fi
            echo "non-200, retrying in 10s..."
            cat /tmp/result.json 2>/dev/null || true
            sleep 10
          done
          echo "both attempts failed — next scheduled run will retry"
          exit 0  # don't fail; cron self-heals
