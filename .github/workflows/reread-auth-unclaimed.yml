name: Re-read auth_unclaimed at deterministic blocks

# Canonicalizes epoch_snapshots.auth_unclaimed_wei for recently closed
# epochs by sampling getDelegator(valId, auth) at (epoch_end - 10 blocks)
# instead of the live cron's "current block" mid-epoch noise. Fixes the
# phantom "no income" chart rows that come from non-monotonic auth values
# between adjacent epochs.
#
# Runs every hour. Monad epochs are ~5.5h, so one fire per hour catches
# every newly-closed epoch with 5x headroom. The endpoint walks the last
# 4 closed epochs each call (idempotent), so any single missed run
# self-heals on the next fire.
#
# Budget: ~30 min/month at ~25s/run × 730 runs/mo. Stays well under the
# 2000 min/mo GH Actions Free cap when combined with other workflows.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: reread-auth-unclaimed
      cancel-in-progress: false
    steps:
      - name: Hit reread endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://monad-income-tracker.vercel.app/api/cron/reread-auth-unclaimed?lookback=4" \
            | tee /tmp/result.json
          echo ""
          echo "--- summary ---"
          jq -r '"  ok: \(.ok)  durationMs: \(.durationMs)  epochs: \(.epochsProcessed)  updated: \(.totalUpdated)  failed: \(.totalFailed)"' /tmp/result.json || true
