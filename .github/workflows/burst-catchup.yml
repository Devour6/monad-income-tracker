name: Burst catchup (block + MEV indexers)

# Runs every 30 min. Checks lag via /api/v1/indexer/status. If any indexer
# is more than LAG_THRESHOLD blocks behind chain head, fires that indexer's
# cron endpoint up to MAX_BURSTS times in a row to burn down the backlog.
# When caught up, exits in seconds — zero idle cost.
#
# Permanent fix for "indexer silently drifts after a transient failure
# and we have to babysit it." Hardened with retry-per-call so a single
# 5xx doesn't kill the burst.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: burst-catchup
      cancel-in-progress: false
    steps:
      - name: Check lag and burst-catchup if drifting
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # No `set -e` — we want the script to keep going past individual
        # call failures. Bursts are idempotent; partial progress is fine.
        run: |
          BASE="https://monad-income-tracker.vercel.app"
          LAG_THRESHOLD=50000
          MAX_BURSTS=5

          # Hit an endpoint, retry up to 3x on transient errors. Always
          # exits 0; caller doesn't care if a single attempt failed.
          call_with_retry() {
            local url="$1"
            local attempt body code
            for attempt in 1 2 3; do
              body=$(curl -sS --max-time 65 \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -w "\n__HTTP__%{http_code}" \
                "$url" 2>/dev/null)
              code=$(printf '%s' "$body" | tail -1 | sed 's/__HTTP__//')
              if [ "$code" = "200" ]; then
                printf '%s' "$body" | sed '$d'
                return 0
              fi
              echo "  attempt $attempt failed (http=$code), retrying..." >&2
              sleep 2
            done
            echo "  all 3 attempts failed" >&2
            return 0
          }

          # Read current block-indexer lag. Default to 0 on parse failure.
          status_json=$(curl -sS --max-time 30 "$BASE/api/v1/indexer/status" 2>/dev/null || echo '{}')
          block_lag=$(echo "$status_json" | jq -r '.lagBlocks // 0' 2>/dev/null || echo 0)
          # Strip anything that isn't a digit so arithmetic always works.
          block_lag=$(echo "$block_lag" | tr -cd '0-9')
          [ -z "$block_lag" ] && block_lag=0
          echo "block indexer lag: $block_lag blocks (threshold $LAG_THRESHOLD)"

          if [ "$block_lag" -gt "$LAG_THRESHOLD" ]; then
            echo "lag exceeds threshold, bursting up to $MAX_BURSTS block-indexer calls"
            i=1
            while [ "$i" -le "$MAX_BURSTS" ]; do
              echo "--- block call $i ---"
              call_with_retry "$BASE/api/cron/index-blocks" | \
                jq -r '"  processed=\(.blocksProcessed) attributed=\(.blocksAttributed) end=\(.endBlock) dur=\(.durationMs)ms"' 2>/dev/null || true
              # Re-check lag — exit early if caught up.
              new_lag=$(curl -sS --max-time 10 "$BASE/api/v1/indexer/status" 2>/dev/null | \
                jq -r '.lagBlocks // 0' 2>/dev/null | tr -cd '0-9')
              [ -z "$new_lag" ] && new_lag=0
              echo "  lag now: $new_lag"
              if [ "$new_lag" -lt "$LAG_THRESHOLD" ]; then
                echo "caught up, stopping block burst"
                break
              fi
              i=$((i + 1))
            done

            # MEV indexer was likely also lagging — burst 3 calls.
            echo "also bursting MEV indexer 3x..."
            for j in 1 2 3; do
              echo "--- mev call $j ---"
              call_with_retry "$BASE/api/cron/index-mev" | \
                jq -r '"  scanned=\(.blocksScanned) inserted=\(.rowsInserted) end=\(.endBlock) hitBudget=\(.hitBudget)"' 2>/dev/null || true
            done
          else
            echo "block indexer at-head, skipping burst"
          fi

          echo "burst-catchup complete"
