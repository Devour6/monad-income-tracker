name: Index Monad Blocks (fast)

# Aggressive forward indexer. Runs every minute and hammers the
# /api/cron/index-blocks endpoint repeatedly in a single workflow run
# until either:
#   - the lag drops to zero (cursor catches the chain head)
#   - the run hits its workflow timeout
#   - we hit a no-progress condition (cursor doesn't advance between calls)
#
# Each individual call is bounded by the endpoint's own RUN_BUDGET_MS (~50s),
# so the endpoint always returns within Vercel's function timeout. We just
# call it back-to-back to burn down a large lag fast.

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-index:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: index-blocks-fast
      cancel-in-progress: false
    steps:
      - name: Hammer indexer endpoint until caught up
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="https://monad-income-tracker.vercel.app"
          MAX_CALLS=8
          last_block=""
          for i in $(seq 1 $MAX_CALLS); do
            echo "--- call $i ---"
            resp=$(curl --fail-with-body --silent --show-error \
              --max-time 65 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE/api/cron/index-blocks?max_blocks=20000")
            echo "$resp" | jq -r '"blocks: \(.blocksProcessed)  end: \(.endBlock)  duration: \(.durationMs)ms"'
            end=$(echo "$resp" | jq -r '.endBlock // "0"')
            processed=$(echo "$resp" | jq -r '.blocksProcessed // 0')
            if [ "$processed" = "0" ]; then
              echo "no progress, exiting"
              break
            fi
            if [ "$end" = "$last_block" ]; then
              echo "cursor stuck at $end, exiting"
              break
            fi
            last_block="$end"
          done
          echo ""
          echo "--- final status ---"
          curl -s "$BASE/api/v1/indexer/status" | jq '{cursor: .cursor.lastBlock, head: .chainHead, lagBlocks: .lagBlocks}'
