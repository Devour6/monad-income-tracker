name: Snapshot validators (every epoch)

# Hits /api/cron/snapshot every 15 minutes. Monad epochs are ~5.5 hours
# (~330 min), so this gives us ~22 snapshots per epoch. That's overkill
# for income reporting but it absorbs GitHub Actions' unreliable
# scheduling — even if 90% of runs are skipped or delayed we still
# capture every epoch.
#
# Vercel Hobby tier caps cron jobs at daily — that's why the snapshot
# cadence here is driven by GitHub Actions instead of vercel.json.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Hit snapshot endpoint
        run: |
          set -euo pipefail
          URL="https://monad-income-tracker.vercel.app/api/cron/snapshot"
          AUTH=""
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH="-H \"Authorization: Bearer ${CRON_SECRET}\""
          fi
          # shellcheck disable=SC2086
          eval curl -sS -w '\nHTTP %{http_code}\n' --max-time 120 $AUTH "$URL"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
